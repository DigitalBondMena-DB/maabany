<section [appScrollReveal]="revealDirection()" [delay]="revealDelay()" class="bg-neutral-50 py-20 lg:py-28 relative overflow-hidden border-t border-neutral-200/80">
  <div class="max-w-350 mx-auto px-5 md:px-6 lg:px-7 xl:px-8">
    <div class="max-w-3xl mb-16">
      <span class="text-[10px] font-mono tracking-[0.25em] text-primary font-black uppercase block mb-4">
        {{ 'CAPABILITIES' | translate }}
      </span>
      <h2 class="text-3xl md:text-4xl font-black text-neutral-900 uppercase tracking-tight font-mono">
        {{ 'Our Core Services' | translate }}
      </h2>
    </div>

    @if (isLoading()) {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (item of [1, 2, 3]; track $index) {
          <div class="bg-white rounded-2xl overflow-hidden shadow-xs border border-neutral-100 block">
            <app-skeleton class="aspect-video w-full block" />
            <div class="p-8 space-y-3">
              <app-skeleton class="h-6 w-3/4 block" />
              <app-skeleton class="h-4 w-full block" />
              <app-skeleton class="h-4 w-5/6 block" />
            </div>
          </div>
        }
      </div>
    } @else {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (solution of solutions(); track solution.slug) {
          <a
            [routerLink]="['/', currentLang(), 'solutions', solution.slug]"
            class="bg-white rounded-2xl overflow-hidden shadow-xs border border-neutral-100 group hover:shadow-md transition-all duration-300 block cursor-pointer">
            <div class="aspect-video overflow-hidden relative">
              <app-image
                [src]="solution.image"
                [alt]="solution.title"
                classes="size-full object-cover group-hover:scale-105 transition-transform duration-700" />
            </div>
            <div class="p-8">
              <h3 class="text-xl font-bold text-neutral-900 mb-3 group-hover:text-primary transition-colors font-mono">
                {{ solution.title }}
              </h3>
              <p class="text-neutral-600 text-sm leading-relaxed mb-0 font-light">
                {{ solution.description }}
              </p>
            </div>
          </a>
        }
      </div>
    }
  </div>
</section>
