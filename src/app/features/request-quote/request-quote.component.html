<div class="bg-white min-h-screen pb-10">

  @if (isLoading()) {
    <app-skeleton class="h-[60vh] w-full block" />
    <div class="max-w-350 mx-auto px-5 md:px-6 lg:px-7 xl:px-8 py-12 md:py-20 lg:py-24">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16">
        <div class="lg:col-span-5">
          <app-skeleton class="h-10 w-3/4 block mb-6" />
          <app-skeleton class="h-4 w-full block mb-2" />
          <app-skeleton class="h-4 w-5/6 block mb-8" />
        </div>
        <div class="lg:col-span-7">
          <app-skeleton class="h-[600px] w-full rounded-[32px] block" />
        </div>
      </div>
    </div>
  } @else {
    <!-- 1. EDITORIAL HERO HEADER -->
    <app-page-hero
      [title]="banner()?.title || ('Start Your Project' | translate)"
      [categoryBadge]="'Request a Quote' | translate"
      [heroImage]="banner()?.image || 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1920&q=80'"
    />

    <!-- 2. REQUEST A QUOTE FORM SECTION (TWO COLUMN LAYOUT) -->
    <app-quote-form-section />

    <!-- 3. OUR CAPABILITIES & SERVICES SECTION -->
    <app-quote-services-section />

    <!-- 4. SHARED BLUEPRINT-GRID CTA BANNER -->
    <app-cta-banner />
  }
</div>
