<section class="bg-neutral-50 border-t border-neutral-200 py-12 md:py-20 lg:py-24">
  <div class="max-w-350 mx-auto px-5 md:px-6 lg:px-7 xl:px-8">
    
    <div class="flex flex-col md:flex-row items-start md:items-end justify-between mb-12 gap-6">
      <div>
        <span class="text-[#142b52] font-mono text-xs tracking-[0.2em] font-bold uppercase block mb-3">
          {{ 'MORE PROJECTS' | translate }}
        </span>
        <h2 class="text-2xl sm:text-3xl md:text-4xl font-black text-neutral-900 tracking-tight uppercase leading-none font-mono">
          {{ 'Other Completed Works' | translate }}
        </h2>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      @for (p of otherProjects(); track p.slug) {
        <app-media-card
          [title]="p.name"
          [desc]="p.desc"
          [image]="p.image"
          [link]="'/' + currentLang() + '/projects/' + p.slug"
          [badge]="p.category"
          badgePosition="top-left"
          imageHeight="h-48"
        />
      }
    </div>

  </div>
</section>
