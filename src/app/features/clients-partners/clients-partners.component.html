<div class="relative bg-white text-neutral-900 min-h-screen">

  <!-- 1. Hero Header Section -->
  <app-page-hero title="Trusted Partnerships" categoryBadge="Clients & Partners"
    heroImage="https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=1920&q=80" />

  <!-- 2. Clients Marquee (Slider 1: Clients Only - Left Aligned Heading) -->
  <app-client-marquee [showPartners]="false" [showClients]="true" title="Organizations That Trust Maabany"
    subtitle="OUR CLIENTS" headerClass="text-left max-w-full mb-8 space-y-2"
    subtitleClass="text-[10px] font-mono tracking-[0.25em] text-primary font-black uppercase block"
    titleClass="text-xl md:text-3.5xl font-black text-neutral-900 uppercase tracking-tight font-mono" />

  <!-- 3. Partners Marquee (Slider 2: Partners Only - Left Aligned Heading) -->
  <app-client-marquee [showPartners]="true" [showClients]="false" title="Strategic Partnerships That Drive Success"
    subtitle="OUR PARTNERS" headerClass="text-left max-w-full mb-8 space-y-2"
    subtitleClass="text-[10px] font-mono tracking-[0.25em] text-primary font-black uppercase block"
    titleClass="text-xl md:text-3.5xl font-black text-neutral-900 uppercase tracking-tight font-mono" />

  <!-- 4. Why Maabany Section Component -->
  <app-clients-why-choose-us />

  <!-- 5. Shared CTA Banner Section -->
  <app-cta-banner />

</div>
