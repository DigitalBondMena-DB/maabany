<article class="h-full">
  <a [routerLink]="link()"
    class="group bg-white border border-neutral-200 rounded-3xl overflow-hidden hover:shadow-2xl hover:shadow-primary/5 hover:border-primary/40 transition-all duration-500 flex flex-col h-full cursor-pointer">

    <!-- Image with hover zoom effect -->
    <div class="h-56 md:h-64 overflow-hidden relative block shrink-0 bg-neutral-950">
      <app-image [src]="image()" [alt]="title()"
        classes="size-full object-cover transition-transform duration-700 ease-out group-hover:scale-108" />
      <!-- Hover Overlay -->
      <div
        class="absolute inset-0 bg-primary/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
      </div>

      @if (category()) {
      <div
        class="text-[10px] font-mono text-[#142b52] font-bold uppercase tracking-wider absolute z-10 top-4 start-4 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full border border-neutral-200/80 shadow-xs">
        {{ category() }}
      </div>
      }
    </div>

    <!-- Content Body Details -->
    <div class="p-6 flex-1 flex flex-col justify-start ">
      <!-- Date: Appears/fades in on hover -->
      <div
        class="flex items-center text-[10px] font-mono text-neutral-400 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
        <div class="flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
            <line x1="16" x2="16" y1="2" y2="6" />
            <line x1="8" x2="8" y1="2" y2="6" />
            <line x1="3" x2="21" y1="10" y2="10" />
          </svg>
          <span>{{ date() }}</span>
        </div>
      </div>

      <!-- Title -->
      <h3
        class="text-base md:text-lg font-bold text-neutral-900 transition-colors tracking-tight line-clamp-2 uppercase font-mono group-hover:text-primary">
        {{ title() }}
      </h3>

      <!-- Description -->
      <p class="text-xs md:text-[13px] text-neutral-500 leading-relaxed font-light line-clamp-2">
        {{ desc() }}
      </p>
    </div>
  </a>
</article>
