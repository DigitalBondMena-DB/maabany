<div class="relative bg-white text-neutral-900 min-h-screen">

  <!-- 1. Hero Header Section -->
  <app-page-hero [title]="post().title" [categoryBadge]="post().category" [heroImage]="post().image" />

  <!-- 2. Shared Metrics Bar (Author, Published Date, Last Updated) -->
  <app-project-metrics [customItems]="blogMetrics()" />

  <!-- 3. Featured Image (Immediately below Hero with Lightbox) -->
  <div class="max-w-350 mx-auto px-5 md:px-6 lg:px-7 xl:px-8 relative z-20 pt-8">
    <div (click)="openLightbox()"
      class="relative h-75 sm:h-100 md:h-125 w-full rounded-3xl overflow-hidden shadow-2xl border border-neutral-200/50 group cursor-zoom-in">
      <img [src]="post().image" [alt]="post().title"
        class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105" />
      <div
        class="absolute inset-0 bg-linear-to-t from-neutral-950/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <app-project-lightbox [isOpen]="isLightboxOpen()" [images]="[post().image]" [projectTitle]="post().title"
    (close)="closeLightbox()" />

  <!-- 4. Main Editorial Three-Column Grid Content -->
  <section class="max-w-350 mx-auto px-5 md:px-6 lg:px-7 xl:px-8 py-16 md:py-24">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">

      <!-- LEFT SIDEBAR: Shared Table of Contents -->
      <aside class="col-span-1 lg:col-span-3 space-y-6 h-full">
        <div class="sticky top-28">
          @if (tocHeadings().length > 0) {
          <div class="mb-3">
            <app-table-of-contents [items]="tocHeadings()" [activeId]="activeHeadingId()"
              mobileTitle="Table of Contents" (itemClick)="scrollToHeading($event)" />
          </div>
          }

          <!-- Quick Share Widget -->
          <div
            class="bg-neutral-50 border border-neutral-200/80 rounded-2xl p-4 flex flex-col items-center justify-center space-y-2 text-center">
            <p class="text-[9px] font-mono font-bold uppercase text-neutral-400 tracking-widest">{{ 'Share' | translate
              }}
            </p>
            <button type="button" (click)="copyShareLink()"
              class="w-full inline-flex items-center justify-center gap-1.5 px-3 py-2 bg-white border border-neutral-200 hover:border-primary rounded-xl text-[10px] font-mono font-bold uppercase tracking-wider text-neutral-700 hover:text-primary transition-all cursor-pointer">
              @if (copied()) {
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="text-emerald-600 animate-pulse">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
              </svg>
              <span class="text-emerald-600">{{ 'Copied!' | translate }}</span>
              } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3" />
                <circle cx="6" cy="12" r="3" />
                <circle cx="18" cy="19" r="3" />
                <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" />
                <line x1="15.41" x2="8.59" y1="6.51" y2="10.49" />
              </svg>
              <span>{{ 'Copy Link' | translate }}</span>
              }
            </button>
          </div>
        </div>
      </aside>

      <!-- CENTER: Main Blog Content -->
      <main class="col-span-1 lg:col-span-6 max-w-3xl space-y-12">
        <article
          class="prose prose-neutral max-w-none text-neutral-700 text-base md:text-lg font-light leading-relaxed">
          <div [innerHTML]="parsedBlogData().processedHtml | safeHtml"></div>
        </article>
      </main>

      <!-- RIGHT SIDEBAR: Sticky Request a Quote / Consultation Form -->
      <aside class="col-span-1 lg:col-span-3 lg:sticky lg:top-28 self-start space-y-6">
        <app-contact-form [pageSlug]="'blogs-' + slug()"
          [formTitle]="'Have a Similar Project?'"
          [formSubtitle]="'Our engineering team is ready to help bring your vision to life. Let\'s build together.'" />
      </aside>

    </div>
  </section>

  <!-- 5. Related Articles Section -->
  @if (relatedPosts().length > 0) {
  <section class="py-16 md:py-24 bg-neutral-50/60 border-t border-b border-neutral-200/80">
    <div class="max-w-350 mx-auto px-5 md:px-6 lg:px-7 xl:px-8 space-y-12">
      <div class="space-y-2">
        <span class="text-[#142b52] font-mono text-xs uppercase font-bold tracking-widest block">
          {{ 'CONTINUE READING' | translate }}
        </span>
        <h2 class="text-3xl md:text-4xl font-black text-neutral-900 uppercase tracking-tight font-mono">
          {{ 'More Related Articles' | translate }}
        </h2>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        @for (rel of relatedPosts(); track rel.slug) {
        <app-blog-card [title]="rel.title" [desc]="rel.desc" [image]="rel.image" [date]="rel.date"
          [category]="rel.category" [link]="'/' + currentLang() + '/blogs/' + rel.slug" />
        }
      </div>
    </div>
  </section>
  }

  <!-- 6. Shared CTA Banner Section -->
  <app-cta-banner />

</div>
