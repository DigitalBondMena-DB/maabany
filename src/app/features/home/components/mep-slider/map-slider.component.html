<div
    class="size-full rounded-xl overflow-hidden border border-neutral-200/50 relative  shadow-xs group-hover:border-primary/30 transition-all duration-500">
    @if (images().length > 0) {
    <app-image [src]="images()[activeIdx()]" alt="MEP Engineering Systems" fill
        classes="size-full object-cover grayscale contrast-115 group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700 ease-out " />
    } @else {
    <div class="size-full bg-neutral-100 flex items-center justify-center">
        <p class="text-neutral-500 font-mono text-sm">No images available</p>
    </div>
    }

    <div class="absolute inset-0 bg-linear-to-b from-black/60 via-transparent to-black/65 pointer-events-none"></div>

    <!-- Carousel Navigation buttons -->
    @if (images().length > 0){
    <button type="button" (click)="prev($event)"
        class="absolute inset-s-3 top-1/2 -translate-y-1/2 size-8 rounded-full bg-white/95 hover:bg-white text-neutral-800 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 shadow-md border border-neutral-100 cursor-pointer z-20 hover:scale-105 active:scale-95"
        title="Previous image">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4">
            <path d="m15 18-6-6 6-6" />
        </svg>
    </button>

    <button type="button" (click)="next($event)"
        class="absolute inset-e-3 top-1/2 -translate-y-1/2 size-8 rounded-full bg-white/95 hover:bg-white text-neutral-800 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 shadow-md border border-neutral-100 cursor-pointer z-20 hover:scale-105 active:scale-95"
        title="Next image">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4">
            <path d="m9 18 6-6-6-6" />
        </svg>
    </button>

    <!-- Carousel Pagination Dots -->
    <div
        class="absolute bottom-6 inset-s-1/2 -translate-x-1/2 flex gap-1.5 z-20 bg-neutral-950/40 backdrop-blur-md px-2.5 py-1.5 rounded-full border border-white/10">
        @for (img of images(); track $index) {
        <button type="button" (click)="select($index, $event)"
            [class]="'h-1.5 rounded-full transition-all duration-300 cursor-pointer ' + ($index === activeIdx() ? 'bg-primary w-3.5' : 'bg-white/40 hover:bg-white/80 w-1.5')"
            [title]="'Image ' + ($index + 1)">
        </button>
        }
    </div>
    }
</div>
