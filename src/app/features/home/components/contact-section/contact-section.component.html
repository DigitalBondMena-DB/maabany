<section id="contact" class="bg-white relative overflow-hidden z-10 transition-all duration-200 py-16 md:py-24">
  <!-- Subtle engineering line designs in background -->
  <div class="absolute inset-0 opacity-[0.012] pointer-events-none select-none bg-[radial-gradient(#142b52_1px,transparent_1px)] [background-size:20px_20px]"></div>

  <div class="max-w-350 mx-auto px-4 md:px-8">
    <!-- Main Section Header -->
    <div class="text-center max-w-2xl mx-auto mb-16 space-y-4">
      <span class="text-[#142b52] font-mono text-xs uppercase font-extrabold tracking-[0.2em] block">
        {{ 'CONTACT.SECTION_SUBTITLE' | translate }}
      </span>
      <h2 class="text-3xl md:text-5xl font-black text-neutral-900 tracking-tight uppercase">
        {{ 'CONTACT.SECTION_TITLE' | translate }}
      </h2>
    </div>

    <!-- Dual-Column Section Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-stretch">
      <!-- Left Column: Contact Form Sub-component -->
      <div class="lg:col-span-7">
        <app-contact-form
          [selectedBranch]="selectedBranch()"
          (selectBranch)="onBranchSelect($event)"
        />
      </div>

      <!-- Right Column: Regional Office Hub Sub-component -->
      <div class="lg:col-span-5">
        <app-contact-branches
          [selectedBranch]="selectedBranch()"
          [apiBranches]="branchesData()"
          (selectBranch)="onBranchSelect($event)"
        />
      </div>
    </div>
  </div>
</section>
