<a [routerLink]="['/',lang(),'solutions', solution().slug]"
  class="block w-full bg-linear-to-br from-white via-white to-orange-50/15 border-2 border-primary/25 p-6 lg:p-8 rounded-2xl relative overflow-hidden transition-all duration-500 hover:border-primary/50 hover:shadow-[0_20px_40px_rgba(234,138,34,0.04)] hover:-translate-y-1 hover:scale-[1.005] cursor-pointer group">
  <div
    class="absolute inset-0 opacity-8 group-hover:opacity-12 pointer-events-none transition-opacity duration-500 overflow-hidden">
    <svg class="size-full" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="mep-hero-grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M 24 0 L 0 0 0 24" fill="none" stroke="currentColor" stroke-width="0.5" class="text-primary" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#mep-hero-grid)" />
    </svg>
  </div>

  <div
    class="absolute -top-16 -right-16 size-52 bg-linear-to-br from-primary/10 to-transparent rounded-full blur-3xl group-hover:scale-125 transition-transform duration-750">
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-center relative z-10">
    <div class="lg:col-span-6 space-y-4 flex flex-col justify-center">
      <div class="flex items-center justify-between">
        <span
          class="text-3xl font-extrabold text-neutral-200/80 font-mono group-hover:text-primary/25 transition-colors duration-300">
          01
        </span>
      </div>

      <div class="space-y-2">
        <h3
          class="text-xl lg:text-2xl font-black text-neutral-900 group-hover:text-primary transition-colors duration-300 uppercase tracking-tight">
          {{ solution().title }}
        </h3>
        <p class="text-xs sm:text-sm text-neutral-500 leading-relaxed">
          {{ solution().description }}
        </p>
      </div>

      @if (solution().points && solution().points!.length > 0) {
      <div class="pt-3 border-t border-neutral-100 flex flex-wrap gap-4">
        @for (item of solution().points; track item) {
        <div class="flex items-center gap-2 text-xs text-neutral-600 font-medium">
          <div class="size-1.5 rounded-full bg-primary"></div>
          <span>{{ item }}</span>
        </div>
        }
      </div>
      }
    </div>

    <div class="lg:col-span-6 h-60 lg:h-70">
      <app-mep-slider [images]="mepImages()" />
    </div>
  </div>
</a>
