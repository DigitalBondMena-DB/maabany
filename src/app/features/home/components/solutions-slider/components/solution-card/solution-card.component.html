<a [routerLink]="['/', lang(), 'solutions', solution().slug]"
  class="bg-white border border-neutral-200/80 rounded-3xl p-8 relative overflow-hidden transition-all duration-300 hover:border-primary hover:-translate-y-2.5 hover:scale-[1.02] hover:shadow-[0_30px_60px_-15px_rgba(234,138,34,0.15)] flex flex-col justify-between group h-full min-h-110 cursor-pointer">
  <div class="space-y-6">
    <div class="flex items-center justify-between">
      <div
        class="p-3.5 rounded-2xl bg-neutral-50 border border-neutral-200/60 text-neutral-800 transition-all duration-300 group-hover:bg-primary group-hover:text-white group-hover:border-primary group-hover:rotate-3 group-hover:scale-105 group-hover:shadow-primary/20 flex-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6">
          <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />
          <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" />
          <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" />
        </svg>
      </div>
      <span
        class="text-3xl font-extrabold text-neutral-200/80 font-mono group-hover:text-primary/20 transition-colors duration-300">
        {{ (index() + 1) | padZero }}
      </span>
    </div>

    <div class="space-y-3">
      <h3
        class="text-xl font-black text-neutral-900 group-hover:text-primary transition-colors uppercase tracking-tight">
        {{ solution().title }}
      </h3>
      <p class="text-xs text-neutral-500 leading-relaxed">
        {{ solution().description }}
      </p>
    </div>
  </div>

  @if (solution().points && solution().points!.length > 0) {
  <div class="mt-8 pt-6 border-t border-neutral-100 space-y-2.5">
    @for (item of solution().points; track item) {
    <div class="flex items-center gap-2 text-xs text-neutral-600">
      <div class="size-1.5 rounded-full bg-primary"></div>
      <span>{{ item }}</span>
    </div>
    }
  </div>
  }
</a>
