<section [appScrollReveal]="revealDirection()" [delay]="revealDelay()" id="blogs" class="bg-white relative overflow-hidden z-10 transition-all duration-200 py-12 md:py-20 lg:py-24">
  <!-- Decorative structural dimension bar and annotations -->
  <div
    class="absolute inset-e-8 top-12 w-40 h-16 opacity-[0.04] pointer-events-none hidden lg:block select-none text-primary">
    <svg viewBox="0 0 100 40" class="size-full">
      <line x1="10" y1="20" x2="90" y2="20" stroke="currentColor" stroke-width="0.5" />
      <line x1="10" y1="12" x2="10" y2="28" stroke="currentColor" stroke-width="0.5" />
      <line x1="90" y1="12" x2="90" y2="28" stroke="currentColor" stroke-width="0.5" />
      <line x1="6" y1="24" x2="14" y2="16" stroke="currentColor" stroke-width="0.5" />
      <line x1="86" y1="24" x2="94" y2="16" stroke="currentColor" stroke-width="0.5" />
      <text x="50" y="15" class="text-[5px] font-mono fill-current text-center" text-anchor="middle">12,400 mm
        [TYP]</text>
    </svg>
  </div>

  <div
    class="absolute inset-s-6 bottom-12 size-48 opacity-[0.04] pointer-events-none hidden xl:block select-none text-[#142b52]">
    <svg viewBox="0 0 100 100" class="size-full">
      <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="0.25" stroke-dasharray="4 4" />
      <circle cx="50" cy="50" r="25" fill="none" stroke="currentColor" stroke-width="0.5" />
      <circle cx="50" cy="50" r="10" fill="none" stroke="currentColor" stroke-width="0.25" />
      <text x="15" y="15" class="text-[4px] font-mono fill-current">STRUCT_C-1</text>
    </svg>
  </div>

  <div class="max-w-350 mx-auto transition-all duration-200 px-(--outer-padding-x)">
    <div class="text-center max-w-2xl mx-auto mb-16 space-y-2">
      <span class="text-[#142b52] font-mono text-xs uppercase font-bold tracking-widest block">
        {{ 'BLOGS.SUBTITLE' | translate }}
      </span>
      <h2 class="text-3xl md:text-5xl font-black text-neutral-900 uppercase tracking-tight">
        {{ 'BLOGS.TITLE' | translate }}
      </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @if (blogsData() && blogsData()!.length > 0) {
      @for (post of blogsData(); track post.id) {
      <app-media-card [title]="post.title" [desc]="post.excerpt" [image]="post.cover_image"
        [link]="'/' + lang() + '/blogs/' + post.slug" [badge]="(post.published_at | date: 'dd MMM yyyy') || 'BLOG'"
        badgePosition="bottom-left" imageHeight="h-48" />
      }
      } @else {
      @for (post of defaultBlogs; track post.slug) {
      <app-media-card [title]="post.title" [desc]="post.desc" [image]="post.image"
        [link]="'/' + lang() + '/blogs/' + post.slug" [badge]="post.date" badgePosition="bottom-left"
        imageHeight="h-48" />
      }
      }
    </div>

    <!-- Explore All Insights CTA -->
    <div class="mt-16 flex justify-center">
      <a [routerLink]="['/', lang(), 'blogs']" app-button [showArrow]="true" variant="outline">
        {{ 'BLOGS.EXPLORE_ALL' | translate }}
      </a>
    </div>
  </div>
</section>
