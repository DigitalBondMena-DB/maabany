<div class="relative bg-white text-neutral-900 min-h-screen">
  <!-- 1. Shared Page Hero Section -->
  <app-page-hero 
    title="Building Beyond"
    titleHighlight="Expectations"
    categoryBadge="About"
    heroImage="https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=1920&q=80"
  />

  <!-- 2. Company Overview -->
  <app-about-overview />

  <!-- 3. Statistics -->
  <app-about-stats />

  <!-- 4. Mission / Vision / Values -->
  <app-about-values />

  <!-- 5. Our Partners Section (Using Marquee with partners-only condition) -->
  <app-client-marquee 
    title="Our Partners"
    subtitle="TRUSTED BY THE BEST"
    [showPartners]="true"
    [showClients]="false"
    sliderPadding="py-12"
  />

  <!-- 6. Why Choose Maabany -->
  <app-about-why-choose-us />

  <!-- 7. Our Clients Section (Using Marquee with clients-only condition) -->
  <app-client-marquee 
    title="Our Clients"
    subtitle="BUILDING WITH EXCELLENCE"
    [showPartners]="false"
    [showClients]="true"
    sliderPadding="py-12"
  />

  <!-- 8. CTA Banner Section (Shared Component with identical style) -->
  <app-cta-banner />
</div>
