<section [appScrollReveal]="revealDirection()" [delay]="revealDelay()" class="py-12 md:py-20 lg:py-24 relative bg-neutral-50 border-y border-neutral-200 overflow-hidden">
  <div
    class="absolute inset-0 bg-[linear-gradient(to_right,rgba(0,0,0,0.03)_1px,transparent_1px),linear-gradient(to_bottom,rgba(0,0,0,0.03)_1px,transparent_1px)] bg-[size:60px_60px] pointer-events-none">
  </div>

  <div class="max-w-350 mx-auto px-5 md:px-6 lg:px-7 xl:px-8 relative z-10">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-8 md:gap-4 divide-x divide-neutral-200 rtl:divide-x-reverse">
      @for (item of parsedCounters(); track item.id) {
      <div class="flex flex-col items-center text-center px-4">
        <div class="text-4xl md:text-6xl font-black text-neutral-900 font-mono tracking-tight mb-2"
          [appCountUp]="item.target" [appCountUpSuffix]="item.suffix" [appCountUpDuration]="2000"></div>
        <div class="text-xs md:text-sm font-bold text-primary uppercase tracking-widest font-mono">
          {{ item.title }}
        </div>
      </div>
      }
    </div>
  </div>
</section>
