<section class="py-12 md:py-20 lg:py-24 relative bg-neutral-50 border-t border-neutral-200 overflow-hidden">
  <!-- Floating 3D Hyperboloid Tower Wireframe -->
  <div class="absolute right-0 top-12 w-72 h-72 opacity-25 pointer-events-none hidden xl:block">
    <app-floating-wireframe shape="tower" color="#EA8A22" />
  </div>

  <div class="max-w-350 mx-auto px-5 md:px-6 lg:px-7 xl:px-8 relative z-10">
    <div class="max-w-3xl mb-16">
      <span class="text-[#142b52] font-mono text-xs tracking-[0.25em] font-bold uppercase block mb-3">
        {{ 'ABOUT_PAGE.CORE_ADVANTAGES' | translate }}
      </span>
      <h2 class="text-4xl md:text-5xl font-black text-neutral-900 tracking-tighter uppercase leading-[1.1]">
        {{ 'ABOUT_PAGE.WHY_CHOOSE_MAABANY' | translate }}
      </h2>
      <p class="mt-4 text-neutral-600 leading-relaxed font-light text-lg">
        {{ 'ABOUT_PAGE.WHY_CHOOSE_SUBTITLE' | translate }}
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-16 items-stretch">
      <!-- Left sticky column for image -->
      <div class="lg:col-span-5 relative flex flex-col h-full min-h-[450px] lg:min-h-full">
        <div class="lg:sticky lg:top-32 h-full flex flex-col">
          <div class="rounded-[2.5rem] overflow-hidden flex-1 h-full min-h-[450px] lg:h-full relative shadow-2xl border border-neutral-200/50 group bg-neutral-100">
            <img 
              src="https://images.unsplash.com/photo-1531834685032-c34bf0d84c77?auto=format&fit=crop&w=800&q=80" 
              alt="Engineering detail" 
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-neutral-950/15 via-transparent to-transparent pointer-events-none"></div>
          </div>
        </div>
      </div>

      <!-- Right column for cards -->
      <div class="lg:col-span-7 space-y-4">
        @for (feature of advantages; track feature.titleKey) {
          <div class="group bg-white border border-neutral-200/80 p-6 rounded-[1.75rem] transition-all duration-300 relative overflow-hidden hover:border-[#EA8A22] hover:-translate-y-1 hover:shadow-xl cursor-default">
            <div class="absolute -right-8 -bottom-8 w-24 h-24 bg-gradient-to-br from-[#EA8A22]/5 to-transparent rounded-full blur-xl group-hover:scale-150 transition-transform duration-500 pointer-events-none"></div>
            
            <div class="flex gap-6 relative z-10 items-start sm:items-center">
              <div class="shrink-0">
                <div class="w-12 h-12 rounded-2xl bg-neutral-50 border border-neutral-150 text-[#EA8A22] flex items-center justify-center transition-all duration-300 group-hover:bg-[#EA8A22] group-hover:text-white group-hover:border-[#EA8A22] group-hover:rotate-3 group-hover:scale-105 shadow-sm group-hover:shadow-[#EA8A22]/20">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                    <path [attr.d]="feature.iconSvg" />
                  </svg>
                </div>
              </div>
              <div>
                <h4 class="text-lg font-bold text-neutral-900 tracking-tight mb-1 group-hover:text-[#EA8A22] transition-colors">
                  {{ feature.titleKey | translate }}
                </h4>
                <p class="text-neutral-600 text-sm leading-relaxed font-light">
                  {{ feature.descKey | translate }}
                </p>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
