<article class="h-full">
    <a [routerLink]="link()"
        class="bg-white border border-neutral-200 rounded-3xl overflow-hidden group hover:border-primary/40 hover:shadow-2xl hover:shadow-primary/5 transition-all duration-300 flex flex-col h-full cursor-pointer relative">
        <div [class]="'overflow-hidden relative block shrink-0 ' + imageHeight()">
            @if (isCarousel()) {
            <app-image [src]="displayImages()[currentIdx()]" [alt]="title() + ' slide ' + currentIdx()"
                classes="size-full object-cover transition-opacity duration-300" />

            <div class="absolute inset-0 bg-linear-to-t from-neutral-950/40 to-transparent pointer-events-none"></div>

            <!-- Carousel Navigation buttons -->
            <button type="button" (click)="prevSlide($event)" aria-label="Previous Image"
                class="absolute inset-s-3 top-1/2 -translate-y-1/2 size-8 rounded-full bg-white/80 hover:bg-white text-neutral-800 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 shadow-md border border-neutral-100 cursor-pointer z-30">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </button>

            <button type="button" (click)="nextSlide($event)" aria-label="Next Image"
                class="absolute inset-e-3 top-1/2 -translate-y-1/2 size-8 rounded-full bg-white/80 hover:bg-white text-neutral-800 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 shadow-md border border-neutral-100 cursor-pointer z-30">
                <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </button>

            <!-- Carousel Pagination Dots -->
            <div class="absolute bottom-4 inset-s-1/2 -translate-x-1/2 flex gap-1.5 z-20">
                @for (img of displayImages(); track $index) {
                <button type="button" (click)="setSlide($event, $index)"
                    [attr.aria-label]="'Go to slide ' + ($index + 1)"
                    [class]="'h-1.5 rounded-full transition-all duration-300 cursor-pointer ' + ($index === currentIdx() ? 'bg-primary w-3' : 'bg-white/60 w-1.5')">
                </button>
                }
            </div>
            } @else {
            <app-image [src]="displayImages()[0]" [alt]="title()"
                class="size-full object-cover transition-transform duration-[4s] group-hover:scale-105 opacity-[0.99]" />
            <div class="absolute inset-0 bg-linear-to-t from-neutral-950/20 to-transparent pointer-events-none"></div>
            }

            @if (badge()) {
            <div [class]="'text-[10px] font-mono text-[#142b52] font-bold uppercase tracking-wider absolute z-10 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full border border-neutral-200/80 shadow-xs leading-normal' +
              (badgePosition() === 'bottom-left' ? 'bottom-4 inset-s-4' : 'top-4 inset-s-4')">
                {{ badge() }}
            </div>
            }
        </div>
        <div class="p-6 space-y-3 flex-1 flex flex-col justify-between">
            <div class="space-y-2">
                <h3
                    class="text-lg font-bold text-neutral-900 group-hover:text-primary transition-colors uppercase leading-snug line-clamp-2">
                    {{ title() }}
                </h3>
                <p class="text-xs text-neutral-600 leading-relaxed font-light line-clamp-2">
                    {{ desc() }}
                </p>
            </div>
        </div>
    </a>
</article>
