<div
    [class]="'w-full bg-neutral-50/50 border border-dashed border-neutral-300/80 rounded-3xl p-8 md:p-12 text-center relative overflow-hidden flex flex-col items-center justify-center transition-all duration-300 group ' + (compact() ? 'min-h-[200px] p-6' : minHeight()) + ' ' + customClass()">

    <!-- Subtle CAD dot grid overlay matching Maabany architectural theme -->
    <div
        class="absolute inset-0 opacity-[0.06] pointer-events-none select-none bg-[radial-gradient(#142b52_1px,transparent_1px)] [background-size:16px_16px]">
    </div>

    <!-- Tech Blueprint Badge -->
    @if (badge()) {
    <div
        class="absolute top-4 left-4 font-mono text-[9px] text-neutral-400 font-extrabold tracking-widest uppercase select-none opacity-70 flex items-center gap-1.5">
        <div class="w-1.5 h-1.5 rounded-full bg-primary/60 animate-pulse"></div>
        <span>{{ badge() }}</span>
    </div>
    }

    <div class="relative z-10 flex flex-col items-center max-w-md mx-auto space-y-4">
        <!-- Icon Node Container -->
        <div class="relative mb-1">
            <!-- Glow ambient background -->
            <div
                class="absolute inset-0 bg-primary/10 rounded-2xl blur-xl transition-all duration-500 group-hover:bg-primary/20 group-hover:scale-125">
            </div>

            <div
                class="relative w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-white border border-neutral-200/90 shadow-xs flex items-center justify-center text-primary group-hover:border-primary/50 group-hover:scale-105 group-hover:rotate-2 transition-all duration-300">
                <app-icons [icon]="icon()" [width]="24" [height]="24" />
            </div>
        </div>


        <!-- Content Details -->
        <div class="space-y-1.5">
            <h3 class="text-base md:text-lg font-black text-neutral-900 uppercase tracking-tight">
                {{ title() }}
            </h3>
            @if (description()) {
            <p class="text-xs md:text-sm text-neutral-500 font-light leading-relaxed max-w-sm">
                {{ description() }}
            </p>
            }
        </div>

        <!-- Optional Action Button -->
        @if (actionLabel()) {
        <div class="pt-2">
            <button app-button variant="outline" size="sm" [routerLink]="actionLink()"
                (btnClick)="onActionClick($event)">
                {{ actionLabel() }}
            </button>
        </div>
        }

        <!-- Projection slot for additional custom action buttons / content -->
        <ng-content></ng-content>
    </div>
</div>
