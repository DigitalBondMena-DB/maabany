<section class="relative bg-neutral-50 overflow-hidden z-10 transition-all duration-200 py-12 md:py-20 lg:py-24">
  <div class="max-w-350 mx-auto relative z-10 px-(--outer-padding-x) transition-all duration-200">
    <div
      class="bg-[#0a0f1d] border border-neutral-800/80 p-10 md:p-16 rounded-4xl shadow-2xl relative overflow-hidden group">
      <!-- Construction & Engineering Background Image -->
      <div class="absolute inset-0 pointer-events-none select-none overflow-hidden">
        <app-image src="https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=1600&q=80"
          alt="Construction and Engineering"
          classes="w-full h-full object-cover opacity-28 mix-blend-luminosity scale-[1.03] group-hover:scale-100 transition-transform duration-1200 ease-out" />
        <div class="absolute inset-0 bg-linear-to-r from-[#0a0f1d]/75 via-[#0a0f1d]/40 to-[#0a0f1d]/20"></div>
        <div class="absolute inset-0 bg-linear-to-b from-transparent via-transparent to-[#0a0f1d]/30"></div>
      </div>

      <div
        class="absolute inset-0 translate-x-[-150%] -skew-x-25 w-1/2 bg-linear-to-r from-transparent via-white/5 to-transparent group-hover:animate-sweep">
      </div>
      <div
        class="absolute top-1/2 right-0 -translate-y-1/2 size-150 bg-primary/15 rounded-full blur-[100px] pointer-events-none">
      </div>

      <!-- Architectural & Engineering Blueprint Vector Overlay -->
      <div
        class="absolute right-0 top-0 bottom-0 w-full lg:w-1/2 pointer-events-none select-none overflow-hidden opacity-22 lg:opacity-28">
        <!-- Technical Grid Ticks -->
        <svg class="absolute inset-0 w-full h-full" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="cta-grid-ticks" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" opacity="0.2" />
              <line x1="0" y1="20" x2="4" y2="20" stroke="white" stroke-width="0.5" opacity="0.15" />
              <line x1="20" y1="0" x2="20" y2="4" stroke="white" stroke-width="0.5" opacity="0.15" />
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#cta-grid-ticks)" />
        </svg>

        <!-- CAD Drawing Elements -->
        <div class="absolute inset-0 flex items-center justify-end pr-4">
          <svg viewBox="0 0 700 600" class="w-full h-full max-w-none transform translate-x-12 translate-y-8 scale-105"
            fill="none" stroke="white" stroke-width="1" xmlns="http://www.w3.org/2000/svg">
            <g class="bp-line-draw" stroke-width="1" stroke="white">
              <line x1="50" y1="140" x2="650" y2="140" stroke-width="1.5" />
              <line x1="50" y1="150" x2="650" y2="150" stroke-width="0.5" stroke-dasharray="2,2" />
              <line x1="50" y1="130" x2="650" y2="130" stroke-width="0.75" />

              <line x1="50" y1="380" x2="650" y2="380" stroke-width="1.5" />
              <line x1="50" y1="390" x2="650" y2="390" stroke-width="0.5" stroke-dasharray="2,2" />

              <rect x="180" y="80" width="30" height="440" stroke-dasharray="4,4" stroke-width="0.75" />
              <rect x="480" y="80" width="30" height="440" stroke-dasharray="4,4" stroke-width="0.75" />

              <line x1="180" y1="140" x2="480" y2="380" stroke-width="1.2" />
              <line x1="480" y1="140" x2="180" y2="380" stroke-width="1.2" />

              <line x1="180" y1="260" x2="480" y2="260" stroke-width="0.75" stroke-dasharray="4,2" />
              <line x1="330" y1="140" x2="330" y2="380" stroke-width="0.75" stroke-dasharray="8,4" />

              <path d="M 400,430 L 520,380 L 640,430 L 520,480 Z" stroke-width="1" />
              <path d="M 400,310 L 520,260 L 640,310 L 520,360 Z" stroke-width="1" />
              <line x1="400" y1="310" x2="400" y2="430" stroke-width="1" />
              <line x1="520" y1="260" x2="520" y2="380" stroke-width="1.5" />
              <line x1="640" y1="310" x2="640" y2="430" stroke-width="1" />
            </g>

            <g class="bp-fade-slow" stroke="white" stroke-width="0.75" opacity="0.7">
              <path d="M 80,180 L 220,180 L 220,290 L 360,290 L 360,420" />
              <path d="M 220,250 A 40,40 0 0,1 260,210" stroke-dasharray="3,3" />
              <line x1="220" y1="250" x2="220" y2="210" />

              <rect x="75" y="175" width="10" height="10" fill="white" fill-opacity="0.25" />
              <rect x="215" y="175" width="10" height="10" fill="white" fill-opacity="0.25" />
              <rect x="215" y="285" width="10" height="10" fill="white" fill-opacity="0.25" />
              <rect x="355" y="285" width="10" height="10" fill="white" fill-opacity="0.25" />
            </g>

            <g stroke="#EA8A22" stroke-width="0.75" opacity="0.9">
              <line x1="180" y1="60" x2="480" y2="60" />
              <line x1="180" y1="54" x2="180" y2="66" />
              <line x1="480" y1="54" x2="480" y2="66" />

              <line x1="120" y1="140" x2="120" y2="380" />
              <line x1="114" y1="140" x2="126" y2="140" />
              <line x1="114" y1="380" x2="126" y2="380" />

              <text x="330" y="50" fill="#EA8A22" font-size="10" font-family="monospace" text-anchor="middle"
                letter-spacing="1" stroke="none">L = 12.00 m</text>
              <text x="95" y="265" fill="#EA8A22" font-size="10" font-family="monospace" text-anchor="middle"
                letter-spacing="1" stroke="none" transform="rotate(-90 95 265)">H = 6.40 m</text>

              <path d="M 60,200 L 640,200" stroke-dasharray="14,4,2,4" stroke-width="1" />
              <path d="M 60,192 L 60,208 M 640,192 L 640,208" stroke-width="1.5" />
              <text x="50" y="204" fill="#EA8A22" font-size="11" font-family="monospace" font-weight="bold"
                stroke="none">S-01</text>
              <text x="652" y="204" fill="#EA8A22" font-size="11" font-family="monospace" font-weight="bold"
                stroke="none">S-01</text>

              <path d="M 230,140 A 50,50 0 0,1 265,175" fill="none" stroke-width="0.75" />
              <text x="280" y="160" fill="#EA8A22" font-size="9" font-family="monospace" stroke="none">38.6°</text>
            </g>

            <g fill="#EA8A22" opacity="0.85">
              <circle cx="180" cy="140" r="3.5" class="bp-pulse-dot" style="transform-origin: 180px 140px;" />
              <circle cx="480" cy="140" r="3.5" class="bp-pulse-dot" style="transform-origin: 480px 140px;" />
              <circle cx="330" cy="140" r="2.5" class="bp-pulse-dot" style="transform-origin: 330px 140px;" />
              <circle cx="180" cy="380" r="3.5" class="bp-pulse-dot" style="transform-origin: 180px 380px;" />
              <circle cx="480" cy="380" r="3.5" class="bp-pulse-dot" style="transform-origin: 480px 380px;" />
              <circle cx="330" cy="380" r="2.5" class="bp-pulse-dot" style="transform-origin: 330px 380px;" />
            </g>
          </svg>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center relative z-10">
        <!-- Left Text Column -->
        <div class="lg:col-span-7 space-y-3 max-w-122.5">
          <span class="text-primary font-mono text-xs tracking-[0.25em] font-bold uppercase block">
            {{ subtitle() | translate }}
          </span>
          <h2 class="text-4xl md:text-5xl lg:text-6xl font-bold text-white tracking-tighter uppercase leading-[1.1]">
            {{ title() | translate }}
          </h2>
        </div>

        <!-- Right Action Buttons Column -->
        <div class="lg:col-span-5 flex flex-col sm:flex-row lg:flex-col gap-4">
          <a [routerLink]="computedPrimaryLink()"
            class="w-full px-8 py-5 bg-primary hover:bg-[#d97d1b] text-white font-bold text-xs uppercase tracking-widest rounded-2xl transition-all duration-300 shadow-xl shadow-primary/20 hover:shadow-primary/40 flex items-center justify-center gap-2 font-mono group cursor-pointer">
            <span>{{ primaryBtnText() | translate }}</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="w-4 h-4 group-hover:translate-x-1 transition-transform">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </a>

          <button type="button" (click)="handleDownloadProfile()" [disabled]="downloadingProfile()"
            class="w-full px-8 py-5 bg-white/5 hover:bg-white/10 border border-white/10 text-white font-bold text-xs uppercase tracking-widest rounded-2xl transition-all duration-300 flex items-center justify-center gap-2 font-mono group backdrop-blur-sm disabled:opacity-55 cursor-pointer">
            @if (downloadingProfile()) {
            <span class="animate-pulse">{{ 'CTA.PREPARING' | translate }}</span>
            } @else if (downloadSuccess()) {
            <span class="text-primary">{{ 'CTA.DOWNLOADED' | translate }}</span>
            } @else {
            <span>{{ secondaryBtnText() | translate }}</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="w-4 h-4 group-hover:translate-y-0.5 transition-transform">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" x2="12" y1="15" y2="3" />
            </svg>
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
