<div class="w-full max-w-350 mx-auto transition-all duration-200"
  style="padding-left: var(--outer-padding-x, 24px); padding-right: var(--outer-padding-x, 24px); padding-top: var(--outer-padding-top, 16px); padding-bottom: var(--outer-padding-bottom, 4px);">
  <section
    class="relative w-full h-95 md:h-115 lg:h-135 flex flex-col justify-center overflow-hidden bg-neutral-50 border border-neutral-200/60 shadow-xl shadow-neutral-100/40 transition-all duration-200"
    style="border-radius: var(--hero-border-radius, 40px)">

    <!-- Background Image with elegant overlay/gradient -->
    <div class="absolute inset-0 z-0 select-none pointer-events-none">
      <app-image [src]="heroImage()" alt="Hero Background" [priority]="true"
        class="object-cover opacity-18 scale-100 transition-all duration-1000" />
      <div
        class="absolute inset-0 bg-[linear-gradient(to_right,#ea8a2204_1px,transparent_1px),linear-gradient(to_bottom,#ea8a2205_1px,transparent_1px)] bg-size-[32px_32px]">
      </div>
      <div class="absolute top-1/4 -left-1/4 w-1/2 h-1/2 bg-primary/5 blur-[120px] rounded-full mix-blend-multiply">
      </div>
      <div class="absolute -bottom-20 -right-20 size-96 border border-primary/5 rounded-full animate-pulse"></div>
    </div>

    <!-- Hero content wrapper -->
    <div class="relative max-w-350 w-full mx-auto px-5 md:px-6 lg:px-7 xl:px-8 z-10 my-auto transition-all duration-200"
      style="padding-top: var(--hero-nav-spacing, 120px)">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">

        <!-- Left Title & Description -->
        <div class="lg:col-span-7 space-y-4">
          <app-breadcrumb [items]="breadcrumbItems()" [categoryBadge]="categoryBadge()" />

          <div>
            <h1
              class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-black text-neutral-950 tracking-tighter uppercase leading-[0.95] mt-4">
              {{ mainTitle() | translate }}
              @if (activeHighlight()) {
              <span class="text-primary">{{ activeHighlight() | translate }}</span>
              }
            </h1>
          </div>

          @if (description()) {
          <p class="text-neutral-600 text-sm sm:text-base md:text-lg font-light leading-relaxed max-w-2xl">
            {{ description() | translate }}
          </p>
          }
        </div>

      </div>
    </div>
  </section>
</div>
