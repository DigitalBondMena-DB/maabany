<!-- COLLAPSIBLE ACCORDION FOR MOBILE & TABLET SIZES -->
<div class="block lg:hidden mb-8 border border-neutral-200 bg-neutral-50/50 rounded-2xl overflow-hidden shadow-xs">
  <button type="button" (click)="toggleMobile()"
    class="w-full px-6 py-4 flex items-center justify-between text-left text-neutral-900 bg-neutral-50 font-mono text-xs font-bold uppercase tracking-wider cursor-pointer">
    <div class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </svg>
      <span>{{ mobileTitle() | translate }} ({{ items().length }} {{ 'Parts' | translate }})</span>
    </div>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      [class]="'text-neutral-500 transition-transform duration-200 ' + (expanded() ? 'rotate-180' : '')">
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  @if (expanded()) {
  <div class="border-t border-neutral-200 bg-white">
    <ul class="p-5 space-y-2.5">
      @for (item of items(); track item.id) {
      <li>
        <a href="#" (click)="onSelect(item.id, $event)" [class]="'text-left text-xs font-medium py-1 transition-all flex items-center gap-2 ' +
                (activeId() === item.id ? 'text-primary font-bold' : 'text-neutral-500 hover:text-neutral-900')">
          <span [class]="'size-1.5 rounded-full ' + (activeId() === item.id ? 'bg-primary' : 'bg-neutral-300')"></span>
          <span>{{ item.title | translate }}</span>
        </a>
      </li>
      }
    </ul>
  </div>
  }
</div>

<!-- DESKTOP STICKY LEFT COLUMN TABLE OF CONTENTS -->
<div class="hidden lg:block self-start space-y-6">
  <div class="bg-white border border-neutral-200 rounded-3xl p-6 shadow-xs">
    <div class="flex items-center gap-2 pb-4 mb-4 border-b border-neutral-100">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </svg>
      <h4 class="text-xs font-mono font-bold uppercase text-neutral-400 tracking-wider">
        {{ 'Chapters' | translate }}
      </h4>
    </div>

    <div class="relative">
      <div class="absolute inset-s-0.75 top-1.5 bottom-1.5 w-0.5 bg-neutral-100"></div>

      <ul class="space-y-3.5 relative z-10">
        @for (item of items(); track item.id) {
        <li class="ltr:ps-6 rtl:pe-6 relative">
          @if (activeId() === item.id) {
          <div class="absolute inset-s-0.5 top-1 bottom-1 w-1 bg-primary rounded-full transition-all">
          </div>
          }

          <a href="#" (click)="onSelect(item.id, $event)"
            [class]="'text-xs font-medium tracking-tight transition-all flex items-center gap-2.5 py-0.5 ' +
                (activeId() === item.id ? 'text-primary font-bold ltr:translate-x-1 rtl:-translate-x-1' : 'text-neutral-500 hover:text-neutral-800 font-normal')">
            <span
              [class]="'size-1.5 rounded-full shrink-0 ' + (activeId() === item.id ? 'bg-primary' : 'bg-neutral-300')"></span>
            <span>{{ item.title | translate }}</span>
          </a>
        </li>
        }
      </ul>
    </div>
  </div>
</div>
