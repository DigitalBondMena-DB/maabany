@if (isOpen() && images().length > 0) {
<div
  (click)="onClose()"
  class="fixed inset-0 z-99999 flex flex-col items-center justify-between bg-black/85 backdrop-blur-md select-none p-4 md:p-6 overflow-hidden animate-fadeIn cursor-pointer"
  role="dialog" aria-modal="true" [attr.aria-label]="projectTitle() + ' Lightbox'">
  <!-- Top-Right Floating Cancel / Exit Icon Button -->
  <button type="button" (click)="onClose(); $event.stopPropagation()"
    class="absolute top-4 right-4 md:top-6 md:right-6 z-210 p-3 rounded-full bg-neutral-900/80 border border-neutral-700/80 text-white hover:bg-primary hover:border-primary transition-all duration-300 hover:scale-110 active:scale-95 shadow-2xl focus:outline-none focus:ring-2 focus:ring-primary cursor-pointer"
    aria-label="Close image popup" title="Close (Esc)">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </svg>
  </button>

  <!-- Top-Left Floating Photo Counter (Shown only if multiple images exist) -->
  @if (images().length > 1) {
    <div
      (click)="$event.stopPropagation()"
      class="absolute top-4 left-4 md:top-6 md:left-6 z-210 px-3.5 py-1.5 rounded-full bg-black/60 border border-white/10 text-white font-mono text-xs font-bold uppercase tracking-wider backdrop-blur-sm cursor-default">
      {{ currentIndex() + 1 }} / {{ images().length }}
    </div>
  }

  <!-- Main Stage -->
  <div (click)="$event.stopPropagation()" class="relative w-full max-w-6xl h-full max-h-[82vh] flex items-center justify-center overflow-hidden my-auto pointer-events-auto cursor-default">
    <!-- Navigation - Left Arrow (Shown only if multiple images exist) -->
    @if (images().length > 1) {
      <button type="button" (click)="prevImage($event)"
        class="absolute left-2 md:left-6 z-50 p-3 md:p-4 rounded-full bg-neutral-950/70 border border-neutral-800 text-white hover:bg-primary hover:border-primary transition-all duration-300 hover:scale-110 active:scale-95 shadow-xl cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary"
        title="Previous Photo" aria-label="Previous photo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rtl:rotate-180">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>

      <!-- Navigation - Right Arrow -->
      <button type="button" (click)="nextImage($event)"
        class="absolute right-2 md:right-6 z-50 p-3 md:p-4 rounded-full bg-neutral-950/70 border border-neutral-800 text-white hover:bg-primary hover:border-primary transition-all duration-300 hover:scale-110 active:scale-95 shadow-xl cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary"
        title="Next Photo" aria-label="Next photo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rtl:rotate-180">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    }

    <!-- Active Display Image -->
    @let activeSrc = images()[currentIndex()];
    <div (click)="$event.stopPropagation()" (dblclick)="toggleZoom($event)"
      class="relative max-w-full max-h-full flex items-center justify-center cursor-zoom-in transition-transform duration-300 ease-out"
      [style.transform]="'scale(' + zoomScale() + ')'">
      <app-image [src]="activeSrc" [alt]="projectTitle() + ' View ' + (currentIndex() + 1)"
        objectFit="contain" classes="max-w-full max-h-[78vh] w-auto h-auto object-contain rounded-2xl shadow-2xl pointer-events-auto" />
    </div>
  </div>

  <!-- Bottom Thumbnails Strip (Shown only if multiple images exist) -->
  @if (images().length > 1) {
    <div (click)="$event.stopPropagation()" class="w-full max-w-4xl z-50 flex items-center justify-center gap-2.5 overflow-x-auto py-2 px-4 scrollbar-none">
      @for (img of images(); track $index) {
      <button type="button" (click)="selectImage($index, $event)"
        [class]="'relative w-12 h-10 md:w-16 md:h-12 rounded-lg overflow-hidden shrink-0 transition-all duration-300 cursor-pointer ' + 
              ($index === currentIndex() ? 'ring-2 ring-primary scale-105 opacity-100' : 'opacity-40 hover:opacity-80 border border-neutral-800')"
        [attr.aria-label]="'Select thumbnail ' + ($index + 1)">
        <app-image [src]="img" [alt]="'Thumbnail ' + ($index + 1)" classes="w-full h-full object-cover" />
      </button>
      }
    </div>
  }
</div>
}
